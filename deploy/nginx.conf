# nginx front door: /api/ -> gunicorn, / -> frontend dist (vite build).
# Mounted read-only at /etc/nginx/conf.d/default.conf by the web service.
#
# TLS (manual mount; ACME auto is explicitly OUT of scope):
#   1. place fullchain.pem + privkey.pem in deploy/certs/
#   2. uncomment the cert volume lines in docker-compose.yml (web)
#   3. uncomment the 443 server block below and re-up web.

upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # RSAS zips are large (backend hard-caps at 50MB in
    # backend/apps/imports/views.py MAX_UPLOAD_BYTES); allow headroom here
    # so nginx rejects nothing the API would accept.
    client_max_body_size 100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;  # large RSAS imports parse synchronously
        proxy_request_buffering off;
    }

    # --- Django admin (same gunicorn upstream) ---
    location /admin/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        # NOTE: no proxy_cache here (a proxy_cache_valid without proxy_cache_path
        # would be a silent no-op); static caching is nginx-volume/deployment concern.
    }

    # --- Ticket evidence images (api MEDIA_ROOT via shared volume) ---
    location /media/ {
        alias /srv/app/media/;
        expires 7d;
    }

    # --- Frontend SPA (vite build output copied to /usr/share/nginx/html) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

