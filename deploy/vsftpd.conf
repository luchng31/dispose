# vsftpd canonical config for the RSAS drop box (plaintext FTP, INTRANET ONLY).
# Used by deploy/Dockerfile.ftp (debian:12-slim + vsftpd). ${VAR} placeholders
# below are expanded by ftp-entrypoint.sh with the container env at boot.
# Mirrors the same values wired in docker-compose.yml (ftp service).
#
# SECURITY: standard FTP sends credentials in cleartext. Bind/limit to the
# intranet (host firewall + PASV_ADDRESS=intranet IP, never 127.0.0.1).

listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Chroot the dedicated RSAS user into the shared drop dir (rsas-drop volume
# mounted at /rsas-drop; entrypoint also sets it as the user's home).
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/rsas-drop

local_umask=022
file_open_mode=0644

# One dedicated account only; entrypoint creates ${FTP_USER} with a locked
# (nologin) shell, so shell checking must stay off.
check_shell=NO
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Passive mode for LAN clients behind NAT-less intranet.
pasv_enable=YES
pasv_address=${PASV_ADDRESS}
pasv_min_port=${PASV_MIN_PORT}
pasv_max_port=${PASV_MAX_PORT}
pasv_addr_resolve=NO

# Logging for the FTP e2e path (who dropped what, when).
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES
log_ftp_protocol=NO

idle_session_timeout=300
data_connection_timeout=120
connect_from_port_20=YES
ftpd_banner=RSAS drop box (intranet only)
hide_ids=YES
